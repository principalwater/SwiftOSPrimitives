name: Validate
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Import official Swift signing keys
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --compressed --location --proto '=https' \
            https://www.swift.org/keys/all-keys.asc --output "$RUNNER_TEMP/swift-keys.asc"
          gpg --show-keys --with-colons "$RUNNER_TEMP/swift-keys.asc" > "$RUNNER_TEMP/swift-key-fingerprints.txt"
          grep -q 'fpr:::::::::E813C892820A6FA13755B268F167DF1ACF9CE069:' "$RUNNER_TEMP/swift-key-fingerprints.txt"
          gpg --batch --import "$RUNNER_TEMP/swift-keys.asc"
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: "6.4.1"
      - name: Toolchain
        run: swift --version
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          fi
          swift test -c release --jobs 2 -Xswiftc -warnings-as-errors
          modules="$(swift build -c release --show-bin-path)"
          swift Tools/CheckCompileFailures.swift "$(command -v swiftc)" "$modules" Tests/CompileFail "$RUNNER_TEMP/ownership"
          swift run -c release --skip-build page-memory-probe soak 300
          swift run -c release --skip-build page-memory-probe cycle reuse 1000 65536
          swift run -c release --skip-build page-memory-probe footprint reusable
          swift run --package-path Examples/MemoryContracts -c release --jobs 2 \
            -Xswiftc -warnings-as-errors memory-contracts
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            swift run --package-path Examples/MemoryContracts -c release --jobs 2 \
              -Xswiftc -warnings-as-errors memory-faults
          fi
          swift run --package-path Examples/NIOResourceLab -c release --jobs 2
          swift Tools/CheckLowLevel.swift "$(command -v swiftc)" . "$RUNNER_TEMP/low-level"
          for mode in hosted embedded; do
            flags=()
            if [[ "$mode" == embedded ]]; then
              flags=(-enable-experimental-feature Embedded -no-allocations)
              if [[ "$RUNNER_OS" == Linux ]]; then
                flags+=(-Xcc "-fmodule-map-file=$GITHUB_WORKSPACE/Examples/FrameComparison/NativePOSIX.modulemap"
                  -Xcc -isystem -Xcc /usr/include
                  -Xcc -isystem -Xcc "/usr/include/$(uname -m)-linux-gnu")
              fi
            fi
            swiftc -swift-version 6 -O -wmo -parse-as-library \
              -enable-experimental-feature Lifetimes -enable-experimental-feature Volatile \
              -strict-memory-safety -warnings-as-errors ${flags[@]+"${flags[@]}"} \
              Sources/BoundedMemory/FrameLedger.swift Examples/FrameComparison/main.swift \
              -o "$RUNNER_TEMP/frame-$mode"
            "$RUNNER_TEMP/frame-$mode" > "$RUNNER_TEMP/frame-$mode.txt"
            swift Tools/InspectFrameComparison.swift "$RUNNER_TEMP/frame-$mode.txt"
          done
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            swiftc -swift-version 6 -strict-memory-safety -warnings-as-errors \
              -target arm64-apple-ios18.0 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
              -emit-module -module-name PageMemory Sources/PageMemory/*.swift \
              -emit-module-path "$RUNNER_TEMP/PageMemory-ios18.swiftmodule"
            swiftc -swift-version 6 -enable-experimental-feature Lifetimes \
              -strict-memory-safety -warnings-as-errors \
              -target arm64-apple-ios18.0 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
              -emit-module -module-name BoundedMemory Sources/BoundedMemory/*.swift \
              -emit-module-path "$RUNNER_TEMP/BoundedMemory-ios18.swiftmodule"
          fi
      - name: Validate optional Rust Linux references
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          for mode in baseline cached; do
            flags=()
            if [[ "$mode" == cached ]]; then flags=(--cfg cached); fi
            RUSTC_BOOTSTRAP=1 rustup run 1.96.0 rustc --edition 2021 \
              -C opt-level=3 -C panic=abort -C overflow-checks=yes \
              -Z stack-protector=strong -D warnings ${flags[@]+"${flags[@]}"} \
              Examples/FrameComparison/reference.rs -o "$RUNNER_TEMP/frame-rust-$mode"
            nm --undefined-only "$RUNNER_TEMP/frame-rust-$mode" > "$RUNNER_TEMP/rust-imports-$mode.txt"
            grep -q '__stack_chk_fail' "$RUNNER_TEMP/rust-imports-$mode.txt"
            /usr/bin/time -v "$RUNNER_TEMP/frame-rust-$mode" > "$RUNNER_TEMP/frame-rust-$mode.txt"
            swift Tools/InspectFrameComparison.swift "$RUNNER_TEMP/frame-rust-$mode.txt"
          done
