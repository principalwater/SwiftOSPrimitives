name: Validate
on: [push, pull_request]
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
          build_arch: amd64
      - name: Validate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = & swift --version
          if ($LASTEXITCODE -ne 0 -or ($version -join "`n") -notmatch 'Swift version 6\.4\.1(?:\s|$)') {
            throw 'Expected Swift 6.4.1'
          }
          $version
          # Prevent cross-module inlining from dropping SwiftBuild's empty DLL test anchor.
          & swift test -c release --jobs 2 -Xswiftc -warnings-as-errors -Xswiftc -disable-cmo
          if ($LASTEXITCODE -ne 0) { throw 'Release tests failed' }
          $tests = & swift test list --skip-build -c release
          if ($LASTEXITCODE -ne 0 -or @($tests | Where-Object { $_ -match '^PageMemoryTests\.' }).Count -ne 10) {
            throw 'Expected all ten Windows tests to be discovered'
          }
          $modules = (& swift build -c release --show-bin-path | Select-Object -Last 1)
          if ($LASTEXITCODE -ne 0) { throw 'Module lookup failed' }
          $compiler = (Get-Command swiftc).Source
          $checker = Join-Path $env:RUNNER_TEMP 'CheckCompileFailures.exe'
          & $compiler -swift-version 6 Tools/CheckCompileFailures.swift -o $checker
          if ($LASTEXITCODE -ne 0) { throw 'Compiler-check helper build failed' }
          & $checker $compiler $modules Tests/CompileFail "$env:RUNNER_TEMP/ownership"
          if ($LASTEXITCODE -ne 0) { throw 'Compiler ownership controls failed' }
          & swift run -c release --skip-build page-memory-probe soak 300
          if ($LASTEXITCODE -ne 0) { throw 'Native soak failed' }
          & swift run -c release --skip-build page-memory-probe cycle reuse 1000 65536
          if ($LASTEXITCODE -ne 0) { throw 'Native reuse cycle failed' }
          & swift run -c release --skip-build page-memory-probe footprint reusable
          if ($LASTEXITCODE -ne 0) { throw 'Native footprint observation failed' }
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Import official Swift signing keys
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --compressed --location --proto '=https' \
            https://www.swift.org/keys/all-keys.asc --output "$RUNNER_TEMP/swift-keys.asc"
          gpg --show-keys --with-colons "$RUNNER_TEMP/swift-keys.asc" > "$RUNNER_TEMP/swift-key-fingerprints.txt"
          grep -q 'fpr:::::::::E813C892820A6FA13755B268F167DF1ACF9CE069:' "$RUNNER_TEMP/swift-key-fingerprints.txt"
          gpg --batch --import "$RUNNER_TEMP/swift-keys.asc"
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: "6.4.1"
      - name: Toolchain
        run: swift --version
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          fi
          swift test -c release --jobs 2 -Xswiftc -warnings-as-errors
          modules="$(swift build -c release --show-bin-path)"
          swift Tools/CheckCompileFailures.swift "$(command -v swiftc)" "$modules" Tests/CompileFail "$RUNNER_TEMP/ownership"
          swift run -c release --skip-build page-memory-probe soak 300
          swift run -c release --skip-build page-memory-probe cycle reuse 1000 65536
          swift run -c release --skip-build page-memory-probe footprint reusable
          swift run --package-path Examples/NIOResourceLab -c release --jobs 2
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            swiftc -swift-version 6 -strict-memory-safety -warnings-as-errors \
              -target arm64-apple-ios18.0 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
              -emit-module -module-name PageMemory Sources/PageMemory/*.swift \
              -emit-module-path "$RUNNER_TEMP/PageMemory-ios18.swiftmodule"
          fi
